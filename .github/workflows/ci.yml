name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm test
        env:
          TZ: Asia/Seoul
          CI: true
      - name: Show test failure summary
        if: failure()
        run: |
          if [ -f server/.test-ci-failures.json ]; then
            cat server/.test-ci-failures.json
          fi
