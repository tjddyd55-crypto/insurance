name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm test
        env:
          NODE_OPTIONS: --experimental-strip-types
          TZ: Asia/Seoul
